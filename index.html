    <!-- Polyfill Worker to route cross-origin worker scripts through same-origin Blob -->
    <script>
      (function() {
        if (typeof window === 'undefined' || !window.Worker) return;
        const OriginalWorker = window.Worker;
        window.__workerBlobMap = new Map();

        fetch('/814.ffmpeg.js')
          .then(r => r.blob())
          .then(blob => {
            const blobUrl = URL.createObjectURL(blob);
            window.__workerBlobMap.set('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', blobUrl);
            window.__workerBlobMap.set('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', blobUrl);
            window.__workerBlobMap.set('/814.ffmpeg.js', blobUrl);
          })
          .catch(() => {});

        class SafeWorker extends OriginalWorker {
          constructor(scriptURL, options) {
            const urlStr = scriptURL instanceof URL ? scriptURL.href : String(scriptURL);
            if (window.__workerBlobMap && window.__workerBlobMap.has(urlStr)) {
              super(window.__workerBlobMap.get(urlStr), options);
              return;
            }
            if (
              (urlStr.startsWith('http://') || urlStr.startsWith('https://')) &&
              !urlStr.startsWith(window.location.origin)
            ) {
              const blob = new Blob([
                '/* Cross-origin worker proxy */\n',
                'importScripts(' + JSON.stringify(urlStr) + ');'
              ], { type: 'text/javascript' });
              const blobUrl = URL.createObjectURL(blob);
              super(blobUrl, options);
              return;
            }
            super(scriptURL, options);
          }
        }
        window.Worker = SafeWorker;
      })();
    </script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
